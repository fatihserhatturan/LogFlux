version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Writing usage/progress text to stdout/stderr is best-effort
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests and dev tools may ignore Close/Write errors
      - path: (_test\.go|^tools/)
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
